[package]
name = "tcg-pos"
version = "0.1.0"
description = "Punto de venta local de giro configurable"
edition = "2024"

[lib]
name = "tcg_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled", "backup", "functions"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

